<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fact gen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="facts.html">Fact Generator</a>
    </nav>
    <h1> The totally cool fact generator !!!</h1>
    <p> On this page you can click the buttons to generate facts about alligators and chinchillas</p>

    <img src="alligator-florida.jpg" alt="A big ass green florida alligator">

    <button id="fact-button" class="btn">Show me an Alligator fact!</button>

    <p id="fact-text">Click the button!</p>

    <img src="chinchilla.jpg" alt="A fat chinchilla">

    <button id="fact-button2" class="btn">Show me a Chinchilla fact!</button>

    <p id="fact-text2">Click the button!</p>

    <script>
        const alligatorFacts = [
            "Alligators can live 50 years or more.",
            "Their jaws close with enormous force but open weakly.",
            "Baby alligators chirp to call their mother.",
            "Crocodiles and alligators are not the same.",
            "Alligators are no match for the Florida Man.",
            "Alligators can't stand on their hind legs like humans."
        ];

        const button1 = document.querySelector("#fact-button");
        const factText = document.querySelector("#fact-text");

        const chinchillaFacts = [
            "Chinchillas have the densest fur of any land mammal, with up to 60 hairs growing out of a single follicle.",
            "Because their fur is so thick, fleas and other parasites suffocate in it and cannot survive on a chinchilla.",
            "Chinchillas cannot get wet because their dense coat traps moisture and can develop fungus, so they take dust baths in fine volcanic ash instead.",
            "A chinchilla's front teeth are naturally bright orange and grow continuously throughout its entire life.",
            "Native to the Andes Mountains of South America, chinchillas can jump up to six feet vertically to escape predators on rocky cliffs.",
            "If a predator grabs a chinchilla, it can release a patch of fur to slip away, a defense mechanism known as fur slip."
        ];

        const button2 = document.querySelector("#fact-button2");
        const factText2 = document.querySelector("#fact-text2");

        //hi claude, is it really that simple? :)
        function showFact(list, output) {
            let index = Math.floor(Math.random() * list.length);

            while (output.textContent === list[index]){
                index = Math.floor(Math.random() * list.length);
            }
            
            output.textContent = list[index];
        }


        button1.addEventListener("click", function () {
            showFact(alligatorFacts, factText);
        });

        button2.addEventListener("click", function () {
            showFact(chinchillaFacts, factText2);
        });

    </script>


</body>

</html>
